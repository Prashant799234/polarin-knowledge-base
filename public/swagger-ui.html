<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polarin API Reference – Staging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f8fafc; font-family: 'Lato', sans-serif; }

    /* Hide built-in topbar */
    .swagger-ui .topbar { display: none !important; }

    /* Custom header bar */
    #custom-header {
      background: linear-gradient(135deg, #0a3954 0%, #1c808d 100%);
      color: #fff;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    #custom-header .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    #custom-header .badge {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* Swagger UI tweaks */
    .swagger-ui { font-family: 'Lato', sans-serif; }
    .swagger-ui .info { margin: 24px 32px 0; }
    .swagger-ui .info .title { font-size: 26px; font-weight: 800; color: #0a3954; }
    .swagger-ui .info .description p { color: #4b5563; line-height: 1.7; }
    .swagger-ui .scheme-container { background: #f0f4f8; border-bottom: 1px solid #e2e8f1; padding: 12px 32px; }
    .swagger-ui .opblock-tag { border-bottom: 1px solid #e2e8f1; font-size: 17px; font-weight: 700; color: #0a3954; padding: 12px 0; }
    .swagger-ui .opblock-tag:hover { background: #f0f9ff; }
    .swagger-ui .opblock { border-radius: 8px !important; margin: 6px 0; }
    .swagger-ui .opblock .opblock-summary { border-radius: 8px; }
    .swagger-ui .btn.authorize { background: #1c808d !important; border-color: #1c808d !important; }
    .swagger-ui .btn.authorize svg { fill: #fff !important; }
    .swagger-ui .btn.authorize span { color: #fff !important; }
    .swagger-ui .btn.execute { background: #0a3954 !important; border-color: #0a3954 !important; }
    .swagger-ui .model-box { background: #f8fafc; border-radius: 8px; }
    .swagger-ui .wrapper { max-width: 1200px; margin: 0 auto; padding: 0 32px 60px; }
    .swagger-ui select { border-radius: 6px; border: 1.5px solid #e2e8f1; padding: 6px 10px; }
    .swagger-ui input[type=text], .swagger-ui textarea { border-radius: 6px; border: 1.5px solid #e2e8f1; }
    .swagger-ui .filter-container input { border-radius: 6px; }

    /* CORS error message overlay */
    #cors-notice {
      display: none;
      margin: 24px 32px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 14px;
      color: #9a3412;
    }
  </style>
</head>
<body>
  <div id="custom-header">
    <span class="title">Polarin API Reference</span>
    <span class="badge">Staging Environment</span>
  </div>
  <div id="cors-notice">
    <strong>⚠ API spec could not be loaded.</strong> The staging API server may not allow cross-origin requests from this domain.
    Direct access: <a href="https://uat-api-polarin.lightstorm.in/v3/api-docs" target="_blank" style="color:#1c808d;">View raw spec</a>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "https://uat-api-polarin.lightstorm.in/v3/api-docs",
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        deepLinking: true,
        filter: true,
        displayOperationId: false,
        defaultModelsExpandDepth: -1,
        defaultModelExpandDepth: 1,
        displayRequestDuration: true,
        tryItOutEnabled: false,
        persistAuthorization: true,
        onComplete: function() {
          // Check if the spec loaded successfully
          const hasError = document.querySelector('.swagger-ui .errors-wrapper');
          if (hasError) {
            document.getElementById('cors-notice').style.display = 'block';
          }
        },
      });
    };
  </script>
</body>
</html>
